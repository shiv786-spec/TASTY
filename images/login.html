<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .reservation {
            padding: 80px 20px;
            background: #f8f8f8;
            display: flex;
            justify-content: center;
        }

        .booking-form {
            width: 100%;
            max-width: 700px;
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .booking-form h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .booking-form p {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-book {
            width: 100%;
            padding: 14px;
            background: #c59d5f;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-book:hover {
            background: #a57f45;
        }

        @media(max-width:768px) {
            .row {
                grid-template-columns: 1fr;
            }

            .booking-form {
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <section class="reservation">
        <div class="booking-form">
            <h2>Book a Table</h2>
            <p>Reserve your table for a memorable dining experience.</p>

            <form>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="persons">Number of Persons</label>
                        <input type="number" id="persons" min="1" placeholder="2">
                    </div>

                    <div class="form-group">
                        <label for="table">Table Type</label>
                        <select id="table">
                            <option>Standard</option>
                            <option>Family</option>
                            <option>VIP</option>
                            <option>Outdoor</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date">
                    </div>

                    <div class="form-group">
                        <label for="time">Time</label>
                        <input type="time" id="time">
                    </div>
                </div>

                <button type="submit" class="btn-book">
                    Book Table
                </button>
            </form>
        </div>
    </section>
</body>

</html>
